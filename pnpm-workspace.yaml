# pnpm 11 reads install-script policy from this file (not package.json), as a
# package -> boolean map. Every package that ships an install script must get an
# explicit decision here before pnpm will run any command.
#
# esbuild: DENIED.
#   It arrives transitively via astro and vite — not a direct dependency
#   (`pnpm why esbuild`). Its postinstall only links the platform binary, which
#   @esbuild/darwin-arm64 already provides. Verified with the script skipped:
#   the binary runs (0.28.2) and esbuild.transformSync() compiles TS correctly.
#   Denying costs nothing and keeps the install free of executable hooks.
#
# workerd: ALLOWED.
#   It comes in with wrangler, and its install script is what puts the
#   platform binary (@cloudflare/workerd-<os>-<arch>) in place. Skipping it
#   leaves `wrangler dev` with no runtime to start. The static build does not
#   need it, but the same lockfile serves local dev, so it stays on.
#
# Flip a package to true only with a reason recorded here.
allowBuilds:
  esbuild: false
  workerd: true
minimumReleaseAgeExclude:
  - '@astrojs/cloudflare@14.2.6'
  - '@astrojs/internal-helpers@0.11.0'
